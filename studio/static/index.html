<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rivulet Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="chrome">
        <div class="brand"><span class="brand-mark" aria-hidden="true"></span>Rivulet</div>
        <input id="search" type="search" placeholder="Search…" />
        <select id="category"></select>
        <select id="quality">
          <option value="all">All</option>
          <option value="flagship">Flagship</option>
          <option value="solid">Solid</option>
          <option value="tutorial">Tutorial</option>
          <option value="skill">Skill</option>
        </select>
        <label class="check">
          <input id="launchableOnly" type="checkbox" checked />
          Runnable
        </label>
        <div class="stats" id="stats"></div>
      </header>

      <div class="workspace">
        <aside class="list" id="list"></aside>
        <main class="detail">
          <section class="rail" id="brief">
            <p class="empty">Select a project to open it here.</p>
          </section>
          <section class="stage">
            <iframe id="frame" title="Running project" hidden></iframe>
            <div id="stageEmpty" class="stage-empty">Pick a runnable project. Insurance claim stays on in its own container.</div>
          </section>
        </main>
      </div>
    </div>
    <script src="/assets/app.js"></script>
  </body>
</html>
